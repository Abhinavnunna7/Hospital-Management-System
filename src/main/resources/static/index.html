<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CarePulse | Hospital Management System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body>

    <div id="toast-container" class="toast-container" aria-live="polite"></div>

    <!-- Authentication Modal (Sign In / Register) -->
    <div id="login-modal" class="modal-overlay">
        <div class="ui-card login-card">
            <div class="brand-header">
                <div class="brand-icon">
                    <i class="fa-solid fa-heart-pulse"></i>
                </div>
                <h2>CarePulse HMS</h2>
                <p class="brand-subtitle">Enterprise Clinical & Hospital System</p>
            </div>

            <!-- Tab Switcher -->
            <div class="tab-switcher" role="tablist">
                <button type="button" id="tab-login" role="tab" aria-selected="true" class="btn btn-xs active-tab">Sign In</button>
                <button type="button" id="tab-register" role="tab" aria-selected="false" class="btn btn-xs inactive-tab">Register</button>
            </div>

            <!-- Sign In Form -->
            <form id="login-form">
                <div class="input-group">
                    <label for="login-username"><i class="fa-solid fa-user"></i> Username</label>
                    <input type="text" id="login-username" class="ui-input" required placeholder="Enter username" autocomplete="username">
                </div>
                <div class="input-group">
                    <label for="login-password"><i class="fa-solid fa-lock"></i> Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="login-password" class="ui-input" required placeholder="••••••••" autocomplete="current-password">
                        <button type="button" class="password-toggle-btn" aria-label="Toggle password visibility" aria-pressed="false" data-target="login-password" tabindex="0">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-block mt-12">
                    <i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In to Portal
                </button>
            </form>

            <!-- Register Form -->
            <form id="register-form" class="hidden">
                <div class="input-group">
                    <label for="reg-username"><i class="fa-solid fa-user"></i> Username</label>
                    <input type="text" id="reg-username" class="ui-input" required placeholder="Choose username" autocomplete="username">
                </div>
                <div class="input-group">
                    <label for="reg-email"><i class="fa-solid fa-envelope"></i> Email</label>
                    <input type="email" id="reg-email" class="ui-input" required placeholder="name@hospital.com" autocomplete="email">
                </div>
                <div class="input-group">
                    <label for="reg-password"><i class="fa-solid fa-lock"></i> Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="reg-password" class="ui-input" required minlength="8" placeholder="At least 8 characters" autocomplete="new-password">
                        <button type="button" class="password-toggle-btn" aria-label="Toggle password visibility" aria-pressed="false" data-target="reg-password" tabindex="0">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                </div>
                <div class="input-group">
                    <label for="reg-confirm-password"><i class="fa-solid fa-shield-halved"></i> Confirm Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="reg-confirm-password" class="ui-input" required placeholder="Re-enter password" autocomplete="new-password">
                        <button type="button" class="password-toggle-btn" aria-label="Toggle password visibility" aria-pressed="false" data-target="reg-confirm-password" tabindex="0">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                    <span id="password-match-error" class="input-error hidden">Passwords do not match</span>
                </div>
                <div class="input-group">
                    <label for="reg-role"><i class="fa-solid fa-id-badge"></i> System Role</label>
                    <select id="reg-role" class="ui-input" required>
                        <option value="RECEPTIONIST">Receptionist</option>
                        <option value="DOCTOR">Doctor</option>
                        <option value="NURSE">Nurse</option>
                        <option value="LAB_TECHNICIAN">Lab Technician</option>
                        <option value="ADMIN">Admin</option>
                        <option value="PATIENT">Patient (Self-Service)</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary btn-block mt-12">
                    <i class="fa-solid fa-user-plus"></i> Create Account
                </button>
            </form>
        </div>
    </div>

    <!-- Mobile Drawer Backdrop Overlay -->
    <div id="sidebar-overlay" class="sidebar-overlay hidden"></div>

    <!-- Application Dashboard Shell -->
    <div id="app-container" class="app-layout hidden">
        <!-- Sidebar Navigation -->
        <aside id="app-sidebar" class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-brand">
                    <i class="fa-solid fa-heart-pulse logo-icon"></i>
                    <div class="brand-text">
                        <h3>CarePulse</h3>
                        <span>HMS Enterprise</span>
                    </div>
                </div>
                <button type="button" id="sidebar-close-btn" class="sidebar-close-btn" aria-label="Close sidebar">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <nav class="sidebar-nav">
                <button class="nav-item active" data-view="dashboard">
                    <i class="fa-solid fa-chart-pie"></i> <span>Overview</span>
                </button>
                <button class="nav-item" data-view="patients">
                    <i class="fa-solid fa-address-book"></i> <span>Patient Registry</span>
                </button>
                <button class="nav-item" data-view="beds">
                    <i class="fa-solid fa-bed-pulse"></i> <span>Ward & Beds</span>
                </button>
                <button class="nav-item" data-view="admissions">
                    <i class="fa-solid fa-hospital-user"></i> <span>Admissions (IPD)</span>
                </button>
                <button class="nav-item" data-view="lab">
                    <i class="fa-solid fa-flask-vial"></i> <span>Diagnostic Lab</span>
                </button>
                <button class="nav-item" data-view="mar">
                    <i class="fa-solid fa-pills"></i> <span>Medication (MAR)</span>
                </button>
                <button class="nav-item" data-view="ot">
                    <i class="fa-solid fa-syringe"></i> <span>OT Suite</span>
                </button>
                <button class="nav-item" data-view="billing">
                    <i class="fa-solid fa-file-invoice-dollar"></i> <span>Billing & Payments</span>
                </button>
            </nav>

            <div class="sidebar-footer">
                <div class="user-chip">
                    <div class="user-avatar" id="user-avatar-initial">A</div>
                    <div class="user-details">
                        <span id="user-name-display" class="user-name">Admin</span>
                        <span id="user-role-badge" class="badge badge-admin">ADMIN</span>
                    </div>
                </div>
                <button id="logout-btn" class="btn btn-xs btn-danger-subtle" title="Sign Out">
                    <i class="fa-solid fa-power-off"></i>
                </button>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-wrapper">
            <header class="top-header">
                <div class="header-left">
                    <button type="button" id="sidebar-toggle-btn" class="menu-toggle-btn" aria-label="Open sidebar">
                        <i class="fa-solid fa-bars"></i>
                    </button>
                    <div class="header-title">
                        <h2 id="view-title">Hospital Overview</h2>
                        <span id="view-subtitle" class="view-subtitle">Live hospital status & telemetry</span>
                    </div>
                </div>
                <div class="system-status-chip">
                    <span class="pulse-dot"></span> <span class="status-label">System Live (Port 8080)</span>
                </div>
            </header>

            <section id="main-content" class="content-body"></section>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
